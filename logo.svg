<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Teleprompter">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1E2350"/><stop offset="1" stop-color="#090B1C"/></linearGradient>
    <linearGradient id="hi" gradientUnits="userSpaceOnUse" x1="150" y1="0" x2="362" y2="0"><stop offset="0" stop-color="#6D7CFF"/><stop offset="1" stop-color="#34E0C4"/></linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".3" stop-color="#fff" stop-opacity="1"/>
      <stop offset=".7" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect x="0" y="60" width="512" height="392" fill="url(#fade)"/></mask>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#34E0C4" stop-opacity=".30"/><stop offset="1" stop-color="#34E0C4" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect x="3" y="3" width="506" height="506" rx="113" fill="none" stroke="#fff" stroke-opacity=".08" stroke-width="2"/>
  <ellipse cx="270" cy="256" rx="230" ry="90" fill="url(#glow)"/>
  <!-- scrolling lines of text, fading at top and bottom like a real prompter -->
  <g mask="url(#m)" stroke-linecap="round" stroke-width="30" fill="none">
    <path d="M150 112h200" stroke="#7B83C9" stroke-opacity=".55"/>
    <path d="M150 176h250" stroke="#9AA3E6" stroke-opacity=".8"/>
    <path d="M150 256h212" stroke="url(#hi)" stroke-width="38"/>
    <path d="M150 336h250" stroke="#9AA3E6" stroke-opacity=".8"/>
    <path d="M150 400h160" stroke="#7B83C9" stroke-opacity=".55"/>
  </g>
  <!-- reading-line marker -->
  <path d="M66 226l44 30-44 30z" fill="#34E0C4" stroke="#34E0C4" stroke-width="10" stroke-linejoin="round"/>
</svg>
